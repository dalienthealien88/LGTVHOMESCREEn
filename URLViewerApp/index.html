<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark">
  <title>URL Viewer</title>
  <style>
    :root { font-family: Arial, sans-serif; color: #f5f7fb; background: #080b12; }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; }
    main { width: min(980px, 90vw); padding: 56px; border: 1px solid #27364c; border-radius: 24px; background: #111a28; }
    h1 { margin: 0 0 16px; font-size: 48px; }
    p { margin: 0 0 28px; color: #b5c2d2; font-size: 24px; }
    form { display: flex; gap: 16px; flex-wrap: wrap; }
    input, button { min-height: 76px; border: 2px solid #465c78; border-radius: 12px; font: inherit; font-size: 27px; }
    input { flex: 1; min-width: 0; padding: 0 22px; color: #101722; background: #fff; }
    button { padding: 0 30px; color: #07111e; background: #78d5ff; border-color: #78d5ff; font-weight: 700; cursor: pointer; }
    button.secondary { color: #f5f7fb; background: #26364c; border-color: #465c78; }
    input:focus, button:focus { outline: 4px solid #fff; outline-offset: 3px; }
    #message { min-height: 30px; margin: 18px 0 0; color: #ffbdad; font-size: 20px; }
    #viewer { position: fixed; inset: 0; display: none; background: #080b12; }
    #toolbar { height: 68px; display: flex; align-items: center; gap: 12px; padding: 8px 16px; background: #111a28; }
    #toolbar button { min-height: 48px; font-size: 20px; }
    #page-address { flex: 1; min-width: 0; overflow: hidden; color: #d8e3f0; font-size: 18px; text-overflow: ellipsis; white-space: nowrap; }
    #page-frame { display: block; width: 100%; height: calc(100% - 102px); border: 0; background: #fff; cursor: auto; }
    #frame-note { padding: 8px 16px; color: #d8e3f0; background: #26364c; font-size: 16px; }
    body.viewing { display: block; }
    body.viewing main { display: none; }
    body.viewing #viewer { display: block; }
    @media (max-width: 700px) { main { padding: 30px; } form { flex-direction: column; } input, button { width: 100%; } }
  </style>
</head>
<body>
  <main>
    <h1>URL Viewer</h1>
    <p>Open a website directly, or try the embedded view.</p>
    <form id="open-form">
      <input id="address" type="text" inputmode="url" autocomplete="url" placeholder="https://example.com" aria-label="Website address" autofocus>
      <button type="submit">Open</button>
      <button id="try-embedded" class="secondary" type="button">Try embedded</button>
      <button id="save-default" class="secondary" type="button">Save as default</button>
      <button id="clear-default" class="secondary" type="button">Clear default</button>
    </form>
    <div id="message" role="status" aria-live="polite"></div>
  </main>
  <section id="viewer" aria-label="Website viewer">
    <div id="toolbar">
      <button id="back-to-address" class="secondary" type="button">Back to address</button>
      <div id="page-address"></div>
      <button id="open-full-page" class="secondary" type="button">Open full page</button>
    </div>
    <div id="frame-note" role="status">If this page is blank, use Open full page. Pointer visibility may depend on the website.</div>
    <iframe id="page-frame" title="Website" allow="autoplay; fullscreen; encrypted-media; picture-in-picture" allowfullscreen></iframe>
  </section>
  <script>
    const form = document.getElementById('open-form');
    const address = document.getElementById('address');
    const message = document.getElementById('message');
    const frame = document.getElementById('page-frame');
    let currentUrl = null;
    const defaultAddress = localStorage.getItem('urlviewer.defaultAddress');
    address.value = defaultAddress || localStorage.getItem('urlviewer.lastAddress') || '';

    function getValidAddress() {
      let value = address.value.trim();
      if (!value) throw new Error('Enter a website address first.');
      if (!/^https?:\/\//i.test(value)) value = `https://${value}`;
      let url;
      try { url = new URL(value); } catch (_) { throw new Error('That address does not look valid.'); }
      if (!['http:', 'https:'].includes(url.protocol) || !url.hostname.includes('.')) {
        throw new Error('Use a full website address, such as https://example.com.');
      }
      return url;
    }

    function rememberUrl(url) {
      address.value = url.href;
      currentUrl = url;
      localStorage.setItem('urlviewer.lastAddress', url.href);
    }

    function openEmbedded(url) {
      rememberUrl(url);
      document.getElementById('page-address').textContent = url.href;
      document.body.classList.add('viewing');
      frame.src = url.href;
      frame.focus();
    }

    document.getElementById('save-default').addEventListener('click', () => {
      try {
        const url = getValidAddress();
        localStorage.setItem('urlviewer.defaultAddress', url.href);
        address.value = url.href;
        message.textContent = 'Default saved. Opening it now…';
        window.location.assign(url.href);
      } catch (error) {
        message.textContent = error.message;
        address.focus();
      }
    });

    document.getElementById('clear-default').addEventListener('click', () => {
      localStorage.removeItem('urlviewer.defaultAddress');
      message.textContent = 'Default page cleared.';
    });

    document.getElementById('back-to-address').addEventListener('click', () => {
      frame.src = 'about:blank';
      document.body.classList.remove('viewing');
      address.focus();
    });

    document.getElementById('open-full-page').addEventListener('click', () => {
      if (currentUrl) window.location.assign(currentUrl.href);
    });

    document.getElementById('try-embedded').addEventListener('click', () => {
      let url;
      try { url = getValidAddress(); } catch (error) {
        message.textContent = error.message;
        address.focus();
        return;
      }
      openEmbedded(url);
    });

    form.addEventListener('submit', (event) => {
      event.preventDefault();
      let url;
      try { url = getValidAddress(); } catch (error) {
        message.textContent = error.message;
        address.focus();
        return;
      }
      rememberUrl(url);
      window.location.assign(url.href);
    });

    if (defaultAddress) {
      try {
        window.location.assign(getValidAddress().href);
      } catch (error) {
        message.textContent = error.message;
        address.focus();
      }
    }

  </script>
</body>
</html>

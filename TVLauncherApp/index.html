<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>TV Launcher</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="app-shell">
      <header class="topbar">
        <div class="clock-panel">
          <div id="dateText" class="date-label">Loading date...</div>
          <div id="timeText" class="time-value">--:--</div>
        </div>

        <div class="weather-panel" aria-live="polite">
          <div id="weatherLocation" class="weather-location">Isle of Man</div>
          <div class="weather-reading">
            <div id="weatherIcon" class="weather-icon" aria-hidden="true">☀️</div>
            <div id="weatherTemp" class="weather-temp">--°</div>
          </div>
        </div>
      </header>

      <main class="content">
        <section class="app-carousel" aria-labelledby="appsTitle">
          <div class="carousel-heading">
            <div>
              <span class="eyebrow">YOUR ENTERTAINMENT</span>
              <h1 id="appsTitle">Pick up where you left off</h1>
            </div>
            <span class="browse-hint">← → Browse <span class="hint-divider">·</span> OK Open</span>
          </div>
          <div id="launcherGrid" class="launcher-grid" aria-label="TV app carousel"></div>
        </section>
      </main>

      <aside id="settingsPanel" class="settings-panel hidden" aria-label="TV Launcher settings">
        <div class="panel-header">
          <div>
            <span class="eyebrow">PERSONALISE</span>
            <h2>Home screen</h2>
          </div>
          <span class="back-hint">BACK to close</span>
          <button id="closeSettings" class="close-button" type="button" aria-label="Close settings">✕</button>
        </div>

        <section class="saved-apps-wrap" aria-labelledby="appsOnHomeTitle">
          <div class="settings-copy">
            <h3 id="appsOnHomeTitle">Apps on your home screen</h3>
            <p>Choose which apps appear in your launcher.</p>
            <div id="settingsStatus" class="settings-status" role="status" aria-live="polite">Finding apps on this TV…</div>
          </div>
          <div id="appList" class="saved-apps"></div>
        </section>

        <button id="returnHome" class="return-home-button" type="button">
          <span aria-hidden="true">⌂</span>
          <span>Return to LG Home</span>
          <span class="button-arrow" aria-hidden="true">↗</span>
        </button>
      </aside>

      <button id="openSettings" class="settings-toggle" type="button" aria-label="Home screen settings">
        <span aria-hidden="true">⚙</span>
      </button>
      <div id="launchStatus" class="launch-status" role="status" aria-live="polite"></div>
    </div>

    <script src="webOSTV.js"></script>
    <script src="app.js"></script>
  </body>
</html>
